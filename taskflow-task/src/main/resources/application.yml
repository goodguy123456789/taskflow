
server:
  port: 8082

spring:
  rabbitmq:
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 1
  application:
    name: taskflow-task
  cloud:
    openfeign:
      client:
        config:
          taskflow-user:
            connectTimeout: 2000
            readTimeout: 3000

taskflow:
  demo:
    fail-consumer: false
  user-service:
    url: http://localhost:8081
