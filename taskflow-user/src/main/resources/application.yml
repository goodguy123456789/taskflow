server:
  port: 8081

spring:
  application:
    name: taskflow-user
  datasource:
    url: ${TASKFLOW_USER_DB_URL:jdbc:mysql://127.0.0.1:3306/taskflow_user}
    username: ${TASKFLOW_USER_DB_USERNAME}
    password: ${TASKFLOW_USER_DB_PASSWORD}
  cloud:
    nacos:
      discovery:
        enabled: false

mybatis:
  mapper-locations: classpath:mapper/*.xml
