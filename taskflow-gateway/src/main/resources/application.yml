server:
  address: 127.0.0.1
  port: 8090

spring:
  application:
    name: taskflow-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: taskflow-user
              uri: http://127.0.0.1:8081
              predicates:
                - Path=/api/users/**
            - id: taskflow-task
              uri: http://127.0.0.1:8082
              predicates:
                - Path=/api/tasks,/api/tasks/**